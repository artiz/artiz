<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KateChat">
  <style>
    .dot { animation: typing 1.4s ease-in-out infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }
    .spark { transform-origin: 52px 12px; animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(.8); } 50% { transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .dot, .spark { animation: none; } }
  </style>
  <defs>
    <mask id="bubble" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle class="dot" cx="19" cy="32" r="3.6" fill="#000"/>
      <circle class="dot d2" cx="30" cy="32" r="3.6" fill="#000"/>
      <circle class="dot d3" cx="41" cy="32" r="3.6" fill="#000"/>
      <circle cx="52" cy="12" r="11" fill="#000"/>
    </mask>
  </defs>
  <path d="M12 14h36a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8H28l-11 9v-9h-5a8 8 0 0 1-8-8V22a8 8 0 0 1 8-8z" fill="#2f7dff" mask="url(#bubble)"/>
  <path class="spark" d="M52 3l2.2 6.8L61 12l-6.8 2.2L52 21l-2.2-6.8L43 12l6.8-2.2z" fill="#ff8a1f"/>
</svg>
